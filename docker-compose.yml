services:
  db:
    image: postgres:16
    container_name: quiz-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
    volumes:
      - quiz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quiz} -d ${POSTGRES_DB:-quiz}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  quiz-db-data:
